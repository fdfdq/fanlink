<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>404 - Fanlink 页面未找到</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        /* ========== 复用 Fanlink 主题变量 ========== */
        :root {
            --theme-primary: #86b3a0;
            --theme-primary-light: #a8cfb8;
            --theme-primary-dark: #5f8b6f;
            --theme-bg-start: #d4e9f7;
            --theme-bg-end: #e2f3f5;
            --theme-card-bg: rgba(255, 255, 245, 0.7);
            --theme-text: #2c5a2e;
            --theme-text-light: #4a6e4b;
            --theme-border: rgba(200, 220, 180, 0.6);
            --theme-shadow: rgba(0, 0, 0, 0.08);
            --theme-header-bg: rgba(245, 255, 240, 0.4);
            --btn-radius: 40px;
        }

        /* ========== 暗黑模式变量覆盖 ========== */
        body.dark-mode {
            --theme-bg-start: #141a18;
            --theme-bg-end: #1a2420;
            --theme-card-bg: rgba(30, 40, 35, 0.85);
            --theme-text: #c8d4ce;
            --theme-text-light: #a0b0a8;
            --theme-border: rgba(60, 80, 70, 0.5);
            --theme-shadow: rgba(0, 0, 0, 0.3);
            --theme-header-bg: rgba(20, 28, 24, 0.6);
        }

        /* ========== 高对比度模式 ========== */
        body.high-contrast {
            --theme-text: #000000;
            --theme-text-light: #222222;
            --theme-bg-start: #ffffff;
            --theme-bg-end: #f4f4f4;
            --theme-card-bg: rgba(255, 255, 255, 0.95);
            --theme-border: #888888;
            --theme-header-bg: rgba(240, 240, 240, 0.9);
        }
        body.dark-mode.high-contrast {
            --theme-text: #ffffff;
            --theme-text-light: #eeeeee;
            --theme-bg-start: #000000;
            --theme-bg-end: #141414;
            --theme-card-bg: rgba(0, 0, 0, 0.95);
            --theme-border: #666666;
            --theme-header-bg: rgba(10, 10, 10, 0.9);
        }

        /* ========== 基础全局样式 ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', 'SF Pro Text', 'PingFang SC', Roboto, sans-serif; 
            background: linear-gradient(145deg, var(--theme-bg-start) 0%, var(--theme-bg-start) 40%, var(--theme-bg-end) 100%); 
            background-attachment: fixed; background-size: cover; background-position: center;
            min-height: 100vh; color: var(--theme-text); transition: background 0.4s ease, color 0.3s ease;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 顶部时钟栏（复用 Fanlink 风格） */
        .time-header { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; 
            text-align: center; background: var(--theme-header-bg); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--theme-border); padding: 14px 0 10px;
        }
        .clock-main { 
            font-size: 1.8rem; font-weight: 600; color: var(--theme-text); 
            font-family: monospace; letter-spacing: 2px; 
        }

        /* 404 主卡片 */
        .error-container {
            margin-top: 60px;
            padding: 40px 50px;
            background: var(--theme-card-bg);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            border: 1px solid var(--theme-border);
            box-shadow: 0 12px 40px var(--theme-shadow);
            text-align: center;
            max-width: 480px;
            width: 90%;
            animation: fadeInUp 0.6s ease backwards;
        }

        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .error-code { 
            font-size: 6rem; font-weight: 700; 
            color: var(--theme-primary); line-height: 1; margin-bottom: 10px; 
            text-shadow: 0 4px 12px var(--theme-shadow);
        }
        .error-title { font-size: 1.8rem; margin-bottom: 16px; color: var(--theme-text); }
        .error-desc { color: var(--theme-text-light); margin-bottom: 32px; font-size: 1rem; line-height: 1.6; }

        /* 重定向按钮 */
        .btn-redirect {
            display: inline-block;
            padding: 14px 40px;
            background: var(--theme-primary);
            color: #fff;
            text-decoration: none;
            border-radius: var(--btn-radius);
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px var(--theme-shadow);
        }
        .btn-redirect:hover {
            background: var(--theme-primary-dark);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 24px var(--theme-shadow);
        }
        .btn-redirect:active { transform: scale(0.96); }
        .btn-redirect i { margin-right: 8px; }

        /* 模式切换小按钮（为了风格统一） */
        .mini-toggles { margin-top: 24px; display: flex; justify-content: center; gap: 12px; }
        .mini-btn {
            width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--theme-border);
            background: var(--theme-card-bg); color: var(--theme-text); cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .mini-btn:hover { background: var(--theme-primary); color: white; transform: scale(1.1); }

        .version { 
            position: fixed; bottom: 20px; right: 20px; font-size: 0.75rem; 
            color: var(--theme-text-light); opacity: 0.6; 
        }

        @media (max-width: 480px) {
            .error-container { padding: 30px 20px; }
            .error-code { font-size: 4.5rem; }
        }
    </style>
</head>
<body>

    <!-- 顶部时钟 -->
    <div class="time-header">
        <div class="clock-main" id="liveClock">--:--:--</div>
    </div>

    <!-- 主容器 -->
    <div class="error-container">
        <div class="error-code">404</div>
        <h2 class="error-title">页面走丢了</h2>
        <p class="error-desc">您访问的页面可能已被移除、更名或暂时不可用。<br>您可以返回 Fanlink 首页继续导航。</p>
        
        <!-- 重点：返回首页按钮 -->
        <a href="index.html" class="btn-redirect">
            <i class="fas fa-home"></i> 返回 Fanlink 首页
        </a>

        <!-- 小彩蛋：切换风格（兼容原有的暗黑/高对比） -->
        <div class="mini-toggles">
            <button class="mini-btn" onclick="toggleDarkMode()" title="切换暗黑模式"><i class="fas fa-moon"></i></button>
            <button class="mini-btn" onclick="toggleHighContrast()" title="切换高对比度"><i class="fas fa-eye"></i></button>
        </div>
    </div>

    <div class="version">Fanlink 3.04 · 404</div>

    <script>
        // ========== 时钟逻辑 ==========
        function updateClock() {
            const now = new Date();
            let h = String(now.getHours()).padStart(2, '0');
            let m = String(now.getMinutes()).padStart(2, '0');
            let s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('liveClock').innerText = `${h}:${m}:${s}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ========== 模式切换（匹配 Fanlink 逻辑） ==========
        // 暗黑模式
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('fanlink_404_dark', document.body.classList.contains('dark-mode') ? 'true' : 'false');
        }
        // 高对比度模式
        function toggleHighContrast() {
            document.body.classList.toggle('high-contrast');
            localStorage.setItem('fanlink_404_contrast', document.body.classList.contains('high-contrast') ? 'true' : 'false');
        }

        // 恢复之前保存的状态
        if (localStorage.getItem('fanlink_404_dark') === 'true') {
            document.body.classList.add('dark-mode');
        }
        if (localStorage.getItem('fanlink_404_contrast') === 'true') {
            document.body.classList.add('high-contrast');
        }
    </script>
</body>
</html>
